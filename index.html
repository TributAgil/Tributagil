<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <title>TributÁgil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- hCaptcha (proteção do login via Supabase Auth). render=explicit: o
         widget é montado pelo React em Login.jsx, não por auto-scan. -->
    <script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>

    <!-- Sentry (rastreamento de erros) — carrega SÓ se VITE_SENTRY_LOADER_SRC
         estiver definido no build. Sem a env var, o trecho abaixo não faz nada.
         Pegue a URL do "Loader Script" no seu projeto Sentry (grátis):
         https://<org>.sentry.io -> Settings -> Client Keys -> Loader Script. -->
    <script>
      (function () {
        var src = '%VITE_SENTRY_LOADER_SRC%';
        if (src.slice(0, 4) === 'http') {
          var s = document.createElement('script');
          s.src = src;
          s.crossOrigin = 'anonymous';
          document.head.appendChild(s);
          window.sentryOnLoad = function () {
            try {
              window.Sentry.init({
                environment: location.hostname === 'tributagil.online' ? 'production' : 'preview',
                tracesSampleRate: 0,
              });
            } catch (e) {}
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
